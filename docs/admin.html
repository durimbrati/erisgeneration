<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Admin Login - Eris Generation Ltd</title>
  <link rel="stylesheet" href="admin-style.css" />
</head>
<body>

  <div class="admin-login-container">
  <form id="admin-login-form" class="login-card">
    <h2>Admin Login</h2>
    
    <label for="admin-username">Username</label>
    <input type="text" id="admin-username" placeholder="Enter your username" required>

    <label for="admin-password">Password</label>
    <input type="password" id="admin-password" placeholder="Enter your password" required>

    <button type="submit" class="login-btn">Login</button>
    <div id="login-error" class="error-msg"></div>
  </form>
</div>

<header id="admin-header" style="display: none;">
  <div class="logo-section">
    <img src="assets/logo_durim.png" alt="Eris Generation Ltd" class="logo-img">
    <span class="logo-text">Eris Generation Ltd</span>
  </div>
  <div class="user-section">
    <span id="logged-user">Welcome, <strong></strong></span>
    <button onclick="logout()" class="logout-btn">Logout</button>
  </div>
</header>

  <div id="admin-dashboard">
     <h2>Manage Projects</h2>
    <div class="admin-top-row">
   
 <div class="form-column">
    <form id="project-form">
        
      <label for="project-title">Title</label>
     <input type="text" id="project-title" required>

      <label for="project-description">Description</label>
     <textarea id="project-description" required></textarea>

      <label for="image-upload">Images</label>
      <input type="file" id="image-upload" name="images" multiple accept="image/*" />

      <div class="image-preview-wrapper" id="image-preview"></div>

      <label>
        <input type="checkbox" id="project-featured" />
        Featured
      </label>
<div class="form-buttons">
  <button type="submit">Save Project</button>
  <button type="button" onclick="cancelEdit()">Cancel Edit</button>
</div>
      <!-- <button type="submit">Save Project</button>
      <button type="button" onclick="cancelEdit()">Cancel Edit</button> -->
    </form>
    </div>
     <div class="summary-column">
 <div class="project-summary-widget">
    <h4>Project Summary</h4>
    <ul>
      <li>Total Projects: <strong id="total-count">0</strong></li>
      <li>Featured Projects: <strong id="featured-count">0</strong></li>
      <li>Last Updated: <strong id="last-updated">—</strong></li>
      <li>Last Editor: <strong id="last-editor">—</strong></li>
    </ul>
  </div>
  <div class="contact-submissions-widget">
  <h4>Contact Form Submissions</h4>
  <ul id="contact-submissions-list">
    <li>No submissions yet.</li>
  </ul>
</div>
  </div>
   </div>
    <h3>Existing Projects</h3>
    <div id="projects-list"></div>
  </div>
<div id="confirm-modal" class="modal">
  <div class="modal-content">
    <p id="confirm-message">Are you sure you want to delete this project?</p>
    <div class="modal-actions">
      <button id="confirm-yes">Yes, Delete</button>
      <button id="confirm-no">Cancel</button>
    </div>
  </div>
</div>
<div id="notification-container"></div>

  <script src="admin-backend.js"></script>
</body>
</html>
